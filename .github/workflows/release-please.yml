name: Release please

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: Jubstaaa/deploy-actions/release-please@aa44261903bf43dfea30a1292c9cbef3688cd917 # v2.3.0
              with:
                  app-id: ${{ vars.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
