name: CI / Deploy docs

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            # The plugin tests import dist/plugin.js, so the package has to be
            # built first — dist/ is gitignored and absent on a fresh checkout.
            - run: bun run build
            - run: bun run test

    deploy:
        needs: check
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            # The docs site is its own workspace with its own lockfile; the root
            # package is the published library and is not involved in the deploy.
            - name: Build docs site
              working-directory: site
              run: |
                  bun install --frozen-lockfile
                  bun run build
            # Guard before rsync --delete: an empty or half-written dist would
            # otherwise wipe the live site.
            - name: Sanity-check the build
              run: |
                  test -s site/dist/index.html
                  test "$(find site/dist -type f | wc -l)" -ge 3
            # Served straight off disk by the shared Caddy — no container, so there
            # is nothing to restart. New files are live the moment rsync finishes.
            - name: Deploy to droplet
              env:
                  DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
                  DO_HOST: ${{ secrets.DO_HOST }}
                  DO_USER: ${{ secrets.DO_USER }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$DO_SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                  rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
                    site/dist/ "$DO_USER@$DO_HOST:/opt/proxy/sites/hitslop/"
