name: Deploy site

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-site
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    deploy:
        environment: Production
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - name: Build docs site
              working-directory: site
              run: |
                  bun install --frozen-lockfile
                  bun run build
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            - uses: Jubstaaa/deploy-actions/static@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  source-dir: site/dist
                  site: hitslop
                  health-url: https://hitslop.ilkerbalcilar.com/
