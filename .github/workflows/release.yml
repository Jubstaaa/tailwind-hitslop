name: Publish to npm

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    publish:
        environment: release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run build
            - run: bun run test
            - run: bun run audit
            - name: Check the tag matches the package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || {
                    echo "tag v$TAG does not match package.json $PKG"; exit 1;
                  }
            - name: Refuse to republish an existing version
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm view "tailwind-hitslop@$VER" version >/dev/null 2>&1; then
                    echo "tailwind-hitslop@$VER is already published — bump the version"
                    exit 1
                  fi
            - name: Publish
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm publish --access public --provenance; then exit 0; fi
                  echo "publish reported failure — checking whether it landed anyway"
                  sleep 10
                  test "$(npm view "tailwind-hitslop@$VER" version 2>/dev/null)" = "$VER"
            - name: GitHub release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
                    exit 0
                  fi
                  gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
