name: Publish to npm

# Tag-triggered rather than on every push to main: a version number can only be
# published once, so publishing has to be a deliberate act.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    publish:
        # Trusted publishing: npm accepts this job's OIDC token for this
        # workflow and environment only, so no long-lived npm token exists. The
        # environment only admits v* tags, which only an admin can create.
        environment: release
        runs-on: ubuntu-latest
        permissions:
            # Writes the GitHub release after publishing.
            contents: write
            # Trusted publishing and provenance both sign with this job's OIDC token.
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            # dist/ is gitignored, so the build has to precede the tests that
            # import dist/plugin.js — and it is what gets published.
            - run: bun run build
            - run: bun run test
            - run: bun run audit
            - name: Check the tag matches the package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || {
                    echo "tag v$TAG does not match package.json $PKG"; exit 1;
                  }
            # Fail early and clearly on a version that is already out, rather than
            # discovering it from npm's E403 after the build has run.
            - name: Refuse to republish an existing version
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm view "tailwind-hitslop@$VER" version >/dev/null 2>&1; then
                    echo "tailwind-hitslop@$VER is already published — bump the version"
                    exit 1
                  fi
            # npm can upload the tarball, sign provenance, and *then* fail the run
            # with E403 "cannot publish over the previously published versions" from
            # a duplicate follow-up request — which is what happened on 0.2.2. Since
            # the step above proved the version did not exist beforehand, the
            # registry serving it now means the publish did land.
            - name: Publish
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm publish --access public --provenance; then exit 0; fi
                  echo "publish reported failure — checking whether it landed anyway"
                  sleep 10
                  test "$(npm view "tailwind-hitslop@$VER" version 2>/dev/null)" = "$VER"
            # This used to live in a second tag-triggered workflow (release.yml)
            # that also ran `npm publish`, so every tag published twice.
            - name: GitHub release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
                    exit 0
                  fi
                  gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
