name: Publish to npm

# Tag-triggered rather than on every push to main: a version number can only be
# published once, so publishing has to be a deliberate act.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Required for npm provenance, which attests the tarball was built
            # from this public repo at this commit.
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            # dist/ is gitignored, so the build has to precede the tests that
            # import dist/plugin.js — and it is what gets published.
            - run: bun run build
            - run: bun run test
            - name: Check the tag matches the package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || {
                    echo "tag v$TAG does not match package.json $PKG"; exit 1;
                  }
            # Fail early and clearly on a version that is already out, rather than
            # discovering it from npm's E403 after the build has run.
            - name: Refuse to republish an existing version
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm view "tailwind-hitslop@$VER" version >/dev/null 2>&1; then
                    echo "tailwind-hitslop@$VER is already published — bump the version"
                    exit 1
                  fi
            # npm can upload the tarball, sign provenance, and *then* fail the run
            # with E403 "cannot publish over the previously published versions" from
            # a duplicate follow-up request — which is what happened on 0.2.2. Since
            # the step above proved the version did not exist beforehand, the
            # registry serving it now means the publish did land.
            - name: Publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  VER="$(node -p "require('./package.json').version")"
                  if npm publish --access public --provenance; then exit 0; fi
                  echo "publish reported failure — checking whether it landed anyway"
                  sleep 10
                  test "$(npm view "tailwind-hitslop@$VER" version 2>/dev/null)" = "$VER"
