name: Publish to npm

# Tag-triggered rather than on every push to main: a version number can only be
# published once, so publishing has to be a deliberate act.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Required for npm provenance, which attests the tarball was built
            # from this public repo at this commit.
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            # dist/ is gitignored, so the build has to precede the tests that
            # import dist/plugin.js — and it is what gets published.
            - run: bun run build
            - run: bun run test
            - name: Check the tag matches the package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF#refs/tags/v}"
                  PKG="$(node -p "require('./package.json').version")"
                  test "$TAG" = "$PKG" || {
                    echo "tag v$TAG does not match package.json $PKG"; exit 1;
                  }
            - run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
