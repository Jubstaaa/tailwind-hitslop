<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The static host sends no security headers, so the policy lives here. Inline
      style attributes come from Radix (slider positioning, hidden form inputs);
      data: fonts are the small font subsets Vite inlines.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>tailwind-hitslop — invisible expanded touch targets</title>
    <meta name="description" content="Hit-slop utilities for Tailwind CSS v3 and v4. Expand touch areas without changing layout.">
  </head>
  <body>
    <div id="root"></div>
    <script prerender type="module" src="/src/main.tsx"></script>
  </body>
</html>
